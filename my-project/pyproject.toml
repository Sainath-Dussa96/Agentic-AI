[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "ollama>=0.6.3",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
